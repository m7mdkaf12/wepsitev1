<h1 class="prices-title">Hotel Prices</h1>

<div class="prices-container">

<div class="price-card">
<h2>One Room</h2>
<p>Perfect for one dog</p>
<h3>$15 / night</h3>
</div>

<div class="price-card">
<h2>Two Rooms</h2>
<p>More space and comfort</p>
<h3>$25 / night</h3>
</div>

<div class="price-card">
<h2>Three Rooms</h2>
<p>Large space for active dogs</p>
<h3>$35 / night</h3>
</div>

</div>

<h2 class="booking-title">Book a Room</h2>

<form class="booking-form" id="bookingForm">

<label>Your Name</label>
<input type="text" id="ownerName" required>

<label>Dog Name</label>
<input type="text" id="dogName" required>

<label>City</label>
<input type="text" id="city" required>

<label>Number of Rooms</label>

<select id="rooms">
<option value="1">One Room</option>
<option value="2">Two Rooms</option>
<option value="3">Three Rooms</option>
</select>

<button type="submit">Send</button>

<p id="bookingMessage"></p>

</form>
